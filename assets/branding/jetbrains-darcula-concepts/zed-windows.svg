      <path d="M 322,310 H 698 L 658,354 H 358 Q 350,354 350,362 V 540 L 306,584 V 332 Q 306,310 322,310 Z"/>
      <path d="M 406,396 H 614 L 276,734 H 740 Q 754,734 754,720 V 370 L 798,326 V 754 Q 798,778 774,778 H 232 Q 202,778 220,752 L 554,440 H 438 V 472 L 394,516 V 414 Q 394,396 406,396 Z"/>
      <path d="M 400,650 H 660 Q 672,650 672,638 V 454 L 716,410 V 674 Q 716,694 696,694 H 356 Z"/>
      <path d="M 498,568 H 578 Q 590,568 590,556 V 536 L 634,492 V 592 Q 634,612 614,612 H 454 Z"/>
  </g>
