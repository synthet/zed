<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Warp — macOS material icon</title>
  <desc id="description">Editable JetBrains Darcula artwork. Main glyph only, without a circular fork badge. All visible artwork is vector geometry.</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6897BB"/>
      <stop offset="0.7" stop-color="#9876AA"/>
      <stop offset="1" stop-color="#B796C7"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0.75" y2="1">
      <stop stop-color="#44474A"/>
      <stop offset="0.45" stop-color="#353637"/>
      <stop offset="1" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0.65" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.45" stop-color="#C3CFDC"/>
      <stop offset="1" stop-color="#A9B7C6"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g id="background">
    <!-- Hide this group for transparency outside the icon. -->
    <rect width="1024" height="1024" fill="#2B2B2B"/>
  </g>
  <g id="foundation">
    <rect x="64" y="64" width="896" height="896" rx="184" fill="url(#surface)"/>
  </g>
  <g id="accent-rim">
    <rect x="68" y="68" width="888" height="888" rx="180" fill="none" stroke="url(#rim)" stroke-width="12"/>
    <rect x="70" y="70" width="884" height="884" rx="178" fill="none" stroke="url(#bevel)" stroke-width="3"/>
  </g>
  <g id="glyph-shadow" fill="#141516" opacity="0.4" transform="translate(0 8)">
      <path d="M 274,376 H 481 Q 493,376 490,388 L 421,710 Q 419,720 409,720 H 274 Q 222,720 222,668 V 430 Q 222,376 274,376 Z"/>
      <path d="M 558,300 H 734 Q 806,300 806,370 V 598 Q 806,654 750,654 H 468 Q 458,654 461,642 L 540,312 Q 543,300 558,300 Z"/>
  </g>
  <g id="glyph" fill="url(#silver)" stroke="url(#bevel)" stroke-width="2" stroke-linejoin="round">
      <path d="M 274,376 H 481 Q 493,376 490,388 L 421,710 Q 419,720 409,720 H 274 Q 222,720 222,668 V 430 Q 222,376 274,376 Z"/>
      <path d="M 558,300 H 734 Q 806,300 806,370 V 598 Q 806,654 750,654 H 468 Q 458,654 461,642 L 540,312 Q 543,300 558,300 Z"/>
  </g>
</svg>
